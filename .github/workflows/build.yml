name: Build app packages

on:
  workflow_dispatch:
    inputs:
      android:
        description: '构建 Android APK'
        type: boolean
        default: true
      windows:
        description: '构建 Windows 安装包与便携版'
        type: boolean
        default: true
      webserver:
        description: '构建本地服务版（网页版单文件程序）'
        type: boolean
        default: true
      ios:
        description: '构建 iOS 包（有签名凭据则签名并上传 TestFlight）'
        type: boolean
        default: false
      testflight:
        description: '上传到 TestFlight（需要签名与 App Store Connect 凭据）'
        type: boolean
        default: false
      macos:
        description: '构建 macOS 安装包（需在 Mac 侧验证）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org
  # 安卓包名单独一个变量：PACKAGE_NAME 会同时影响 Windows / iOS / macOS 的
  # bundle id 与 Windows 的 userdata 目录，不能拿来单独改安卓。
  ANDROID_PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME }}
  PACKAGE_NAME: ${{ vars.PACKAGE_NAME }}
  # 额外的内置站源模块目录（可留空）。仓库自带的 modules/ 会自动全部内置，
  # 这里的变量只用于临时追加，例如把私有仓库检出的副本一并打进包。
  BUNDLED_MODULES: ${{ vars.BUNDLED_MODULES }}
  PYTHONUTF8: '1'
  PROJECT_URL: ${{ vars.PROJECT_URL }}
  TELEGRAM_GROUP_URL: ${{ vars.TELEGRAM_GROUP_URL }}
  TELEGRAM_CHANNEL_URL: ${{ vars.TELEGRAM_CHANNEL_URL }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - &setup-go
        uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - &setup-flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
        continue-on-error: true
      - run: dart analyze --fatal-infos lib test
        continue-on-error: true
      # 测试当前不阻塞出包（开发优先、集中验证暂缓），结果仍会显示在运行详情里。
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true
        continue-on-error: true
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ONLY_HONGGUO=true
        continue-on-error: true
      - run: go test -race ./...
        working-directory: native
        continue-on-error: true
      # 内置站源覆盖全部平台是发布前提：漏一个平台就有一整类安装包没有站源，
      # 因此这一项不设 continue-on-error。
      - run: python scripts/check_bundled_platforms.py
      # 布局隐患自查：CrossAxisAlignment.stretch 用在无界交叉轴上会让整块
      # 子树被丢弃（表现为宽屏下某些区块消失）。这类问题只在特定尺寸出现，
      # 单元测试容易漏，因此单独静态检查。
      - run: python scripts/audit_stretch.py

  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          # 默认分支名不写死：main 与 master 都很常见，直接读仓库设置，
          # 换分支名或换仓库都不用再改工作流。
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "只能从默认分支 $DEFAULT_BRANCH 手动发布，当前为 $GITHUB_REF。" >&2
            exit 1
          fi
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          if [ -z "$version" ]; then
            echo "pubspec.yaml 缺少 version。" >&2
            exit 1
          fi
          tag="app-v${version//+/-}"
          # 允许同一版本号重复发布：同名 Release / Tag 会在 release job 里被删除重建，
          # 因此这里不再因为 tag 已存在而终止。
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  android:
    if: ${{ inputs.android }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - &setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - *setup-go
      - *setup-flutter
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"
          accept-android-sdk-licenses: true
      - run: sdkmanager 'ndk;28.2.13676358'
      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "未配置签名 Secrets，拒绝发布 debug 签名的 APK。" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: 缓存 Gradle 依赖
        # 依赖缓存能显著减少对 Maven Central 的重复请求，是 429 限流最有效的预防。
        # 只缓存 modules-2 与 wrapper：构建输出（caches 下其它目录）体积大且容易脏。
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - run: python scripts/build_android.py
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          HONGGUO_SIGNING_CONFIG: ${{ secrets.HONGGUO_SIGNING_CONFIG }}
      - name: 校验 APK 签名证书
        shell: bash
        env:
          CERT_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
          CERT_VARIABLE: SIGNING_CERT_SHA256
        run: |
          set -euo pipefail
          expected=$(printf '%s' "$CERT_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          if [ -z "$expected" ]; then
            echo "未设置仓库变量 $CERT_VARIABLE，无法确认发布证书。" >&2
            exit 1
          fi
          apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f 2>/dev/null | sort | tail -n1 || true)
          if [ -z "$apksigner" ]; then
            sdkmanager 'build-tools;35.0.0' >/dev/null
            apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort | tail -n1)
          fi
          echo "apksigner：$apksigner"
          "$apksigner" --version || true
          for apk in dist/android/*.apk; do
            echo "== $(basename "$apk")"
            output=$("$apksigner" verify --print-certs "$apk" 2>&1 || true)
            printf '%s\n' "$output"
            if ! printf '%s' "$output" | tr -d ':' | tr '[:upper:]' '[:lower:]' | grep "$expected" >/dev/null; then
              echo "签名证书与发布证书不一致，已终止。" >&2
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14

  windows:
    if: ${{ inputs.windows }}
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - *setup-go
      - *setup-python
      - *setup-flutter
      - name: Set up MinGW-w64
        shell: pwsh
        run: |
          choco install mingw --no-progress -y
          $exe = Get-ChildItem -Path 'C:\ProgramData\mingw64', 'C:\ProgramData\chocolatey\lib\mingw' `
                   -Recurse -Include 'x86_64-w64-mingw32-gcc.exe', 'gcc.exe' -ErrorAction SilentlyContinue |
                 Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { $exe = (Get-Command x86_64-w64-mingw32-gcc -ErrorAction SilentlyContinue).Source }
          if (-not $exe) { throw 'MinGW-w64 安装失败，找不到 gcc' }
          Split-Path $exe | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $exe --version | Select-Object -First 1
      - name: Set up Inno Setup
        shell: pwsh
        run: choco upgrade innosetup --no-progress -y
      - run: python scripts/build_windows.py
        env:
          HONGGUO_SIGNING_CONFIG: ${{ secrets.HONGGUO_SIGNING_CONFIG }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14

  ios:
    if: ${{ inputs.ios }}
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - *setup-python
      - *setup-go
      - *setup-flutter
      - name: Check Xcode and CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --find clang
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version
          go version
          flutter --version
          flutter precache --ios
      - name: 配置 iOS 发布签名
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 || vars.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD || vars.APPLE_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 || vars.IOS_PROVISION_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          PACKAGE_NAME: ${{ vars.PACKAGE_NAME }}
        run: |
          set -euo pipefail
          # 证书与描述文件都齐才算「可签名」；缺一个就退回未签名构建，
          # 这样没配 Secrets 的仓库仍然能出包。
          if [ -n "${APPLE_CERTIFICATE_P12_BASE64}" ] && \
             [ -n "${APPLE_CERTIFICATE_PASSWORD}" ] && \
             [ -n "${IOS_PROVISION_PROFILE_BASE64}" ]; then
            python scripts/configure_ios_signing.py
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 iOS 签名凭据，本次只生成未签名 IPA。"
          fi
      - name: Build iOS packages
        shell: bash
        env:
          HONGGUO_SIGNING_CONFIG: ${{ secrets.HONGGUO_SIGNING_CONFIG }}
        run: |
          set -euo pipefail
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            python scripts/build_ios.py --export-options ios/ExportOptions.plist
          else
            python scripts/build_ios.py
          fi
      - name: 上传到 TestFlight
        if: ${{ inputs.testflight && steps.signing.outputs.signed == 'true' }}
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || vars.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY || vars.APP_STORE_CONNECT_PRIVATE_KEY }}
          PACKAGE_NAME: ${{ vars.PACKAGE_NAME }}
        run: |
          set -euo pipefail
          ipa=$(find dist/ios -maxdepth 1 -type f -name '*.ipa' ! -name '*unsigned*' | head -n1)
          if [ -z "$ipa" ]; then
            echo "::error::没有找到签名 IPA，无法上传。"
            exit 1
          fi
          python scripts/upload_testflight.py "$ipa"
          python scripts/set_testflight_notes.py || true
      - name: 构建结果说明
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## iOS 构建产物"
            echo ""
            if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
              echo "已签名 IPA，可直接用于 TestFlight（内部测试）。"
            else
              echo "未签名 IPA（\`*-ios-unsigned.ipa\`），用于侧载自签："
              echo ""
              echo "| 工具 | 适用系统 | 有效期 |"
              echo "| --- | --- | --- |"
              echo "| TrollStore | iOS 14.0 beta2 – 16.6.1 / 16.7 RC / 17.0 | 永久 |"
              echo "| SideStore | iOS 15+（装好后手机上续签） | 7 天 |"
              echo "| Sideloadly | iOS 7 – 27+（需电脑） | 7 天 |"
              echo ""
              echo "iOS 17.0.1 及以上用不了 TrollStore（漏洞已修补，永不支持）。"
              echo "这类设备推荐 SideStore：电脑只用于首次安装，之后在手机上点一下即可续签。"
              echo ""
              echo "用法：电脑用 iloader 装 SideStore → 手机信任证书并开启开发者模式 →"
              echo "连 LocalDevVPN → 在 SideStore 里导入本 IPA。详见 docs/ios-testflight.md。"
            fi
            echo ""
            echo "详见 docs/ios-testflight.md。"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 清理 iOS 临时签名凭据
        if: always()
        shell: bash
        run: python scripts/configure_ios_signing.py --clean || true
      - uses: actions/upload-artifact@v4
        with:
          name: ios-packages
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 14

  macos:
    if: ${{ inputs.macos }}
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - *setup-python
      - *setup-go
      - *setup-flutter
      - name: Check Xcode and CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version
          python -m pip install dmgbuild Pillow
          go version
          flutter --version
          flutter precache --macos
      - name: Build macOS packages
        run: python scripts/build_macos.py
        env:
          HONGGUO_SIGNING_CONFIG: ${{ secrets.HONGGUO_SIGNING_CONFIG }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/macos/*
          if-no-files-found: error
          retention-days: 14

  # 本地服务版：纯 Go 单文件可执行程序，内含网页前端，双击后浏览器打开即可用。
  # 不依赖 Flutter 构建产物，因此单列一个任务，四个平台一次出齐。
  webserver:
    if: ${{ inputs.webserver }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - *setup-go
      - *setup-python
      - name: Build local server packages
        run: python scripts/build_web.py
        env:
          HONGGUO_SIGNING_CONFIG: ${{ secrets.HONGGUO_SIGNING_CONFIG }}
      - uses: actions/upload-artifact@v4
        with:
          name: webserver
          path: dist/web/*
          if-no-files-found: error
          retention-days: 14


  release:
    needs: [checks, prepare, android, windows, ios, macos, webserver]
    # 平台是按需勾选的：没勾的平台会 skipped，用 always() 接管后再逐一校验，
    # 只要能出包就发 Release，已勾选却失败的平台会让下面直接报错终止。
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        # 一个平台都没勾选时这里没有产物可取，交给下一步给出更清楚的提示。
        continue-on-error: true
        with:
          path: release
          merge-multiple: true
      - name: 校验已勾选平台都出了包
        env:
          WANT_ANDROID: ${{ inputs.android }}
          WANT_WINDOWS: ${{ inputs.windows }}
          WANT_WEBSERVER: ${{ inputs.webserver }}
          WANT_IOS: ${{ inputs.ios }}
          WANT_MACOS: ${{ inputs.macos }}
        run: |
          set -euo pipefail
          fail=0
          expect() {
            local want="$1" label="$2" pattern="$3"
            if [ "$want" != "true" ]; then
              echo "跳过（未勾选）：$label"
              return
            fi
            if compgen -G "release/$pattern" >/dev/null; then
              echo "已出包：$label"
            else
              echo "已勾选但缺少安装包：$label（找不到 release/$pattern）" >&2
              fail=1
            fi
          }
          expect "$WANT_ANDROID" "Android" "*.apk"
          expect "$WANT_WINDOWS" "Windows" "*.exe"
          expect "$WANT_WEBSERVER" "本地服务版" "*-web-*"
          expect "$WANT_IOS" "iOS" "*.ipa"
          expect "$WANT_MACOS" "macOS" "*.dmg"
          if [ "$fail" -ne 0 ]; then
            echo "有已勾选的平台没有产出安装包，已终止发布。" >&2
            exit 1
          fi
          if ! compgen -G "release/*" >/dev/null; then
            echo "没有任何安装包可发布。" >&2
            exit 1
          fi
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SIGNING_CERT_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          版本 ${VERSION}。安装包内置红果站源，其余站源在 我的 › 站源 › 模块 的模块商店安装。

          Android：
          - *-arm64-v8a.apk：适用于较新的安卓设备
          - *-armeabi-v7a.apk：适用于较老的安卓设备，电视推荐使用此版本
          - *-x86_64.apk：适用于模拟器

          iOS：
          - *-ios-unsigned.ipa：未签名 IPA，可用相关工具安装

          Windows：
          - *-windows-x64-setup.exe：安装包，默认安装到当前用户，无需管理员权限；安装时可改为所有用户
          - *-windows-x64.zip：便携版，解压后运行 guoapp.exe；设置、记录、海报缓存和默认下载都保存在程序旁的 userdata 目录，升级时把旧版的 userdata 目录复制过来即可

          本地服务版（Windows，无需安装）：
          - *-web-windows-amd64.zip：解压后双击 start.bat，浏览器会自动打开 http://127.0.0.1:8000/web/
          - 已内置 ffmpeg，加密站源开箱即播；不内置站源，打开「我的 › 站源 › 模块」在模块商店安装
          - 听书、直播、自定义源、跨源搜索、去广告、投屏在网页端同样可用

          macOS：
          - *-macos-universal.dmg：适用于 macOS 12 及以上的 Apple 芯片和 Intel 电脑，打开后拖入 Applications；未经公证，首次打开前在终端执行 xattr -dr com.apple.quarantine /Applications/小果影视.app

          Android 签名证书 SHA-256：${SIGNING_CERT_SHA256}
          EOF
          changes="$(awk -v heading="## ${VERSION}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found && !started && /^[[:space:]]*$/ { next }
            found { started = 1; print }
          ' CHANGELOG.md)"
          printf '%s' "$changes" > changes.md
          if [ -n "$changes" ]; then
            { printf '更新内容：\n\n%s\n\n' "$changes"; cat notes.md; } > notes.tmp
            mv notes.tmp notes.md
          fi
          # 可重复发布：同名 Release 已存在时先删除，再用本次构建的产物重建。
          # 删除 Release 不一定会删掉 Tag，再显式清理远程 Tag，确保 create 时
          # 以当前提交重新打 tag，而不是复用旧 tag 指向的旧代码。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "同名 Release $TAG 已存在，删除后重新发布。"
            gh release delete "$TAG" --yes
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "同名 Tag $TAG 仍存在，删除后重建。"
            git push origin --delete "$TAG" >/dev/null 2>&1 || true
          fi
          gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "小果影视 ${VERSION}" --notes-file notes.md
      - name: 推送到 Telegram 频道
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "未配置 Telegram，跳过推送。"
            exit 0
          fi
          changes="$(cat changes.md)"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          text="小果影视 ${VERSION} 已发布"
          if [ -n "$changes" ]; then
            text="$(printf '%s\n\n更新内容：\n\n%s' "$text" "${changes:0:3500}")"
          fi
          text="$(printf '%s\n\n下载：%s' "$text" "$url")"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" >/dev/null
