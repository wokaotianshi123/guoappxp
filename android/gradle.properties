org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
android.useAndroidX=true
android.newDsl=false
# flutter_js 0.8.7 仍在用旧版 kotlin-android 插件；AGP 9 的内置 Kotlin 会拒绝它。
# 待依赖插件迁移完再改回 true（见 Flutter built-in Kotlin 迁移文档）。
android.builtInKotlin=false
# flutter_js 把 Kotlin jvmTarget 写死成 1.8、Java 编译任务却是 11，
# KGP 在 Gradle 8+ 默认把这种不一致当错误（:flutter_js:compileReleaseKotlin 失败）。
# 官方提供的开关：把一致性校验降级为警告，让构建继续。
# 参考 https://kotlinlang.org/docs/gradle-configure-project.html
kotlin.jvm.target.validation.mode=warning
# 按 ABI 拆成 arm64 / arm / x64 三个 flavor 出包（Chaquopy 要求 abiFilters，
# 而 AGP 不允许它和 --split-per-abi 共存）。但 Flutter 3.35 起会主动往
# defaultConfig.ndk.abiFilters 里塞 armeabi-v7a + arm64-v8a + x86_64，
# AGP 再把 defaultConfig 与 flavor 的过滤集合取并集，结果是「单 ABI flavor」
# 的包里混进另外两个 ABI 的原生库，装到 64 位机器上会以
# `libflutter.so is 32-bit instead of 64-bit` 直接闪退。
# 这个开关让 Flutter 不再写默认 abiFilters，交给 flavor 决定。
disable-abi-filtering=true

# —— 网络受限环境（GitHub Actions / 国内直连）的兜底 ——
# 依赖下载偶发 5xx 或 429 时多试几次；Gradle 默认重试次数太少，一次抖动就整包失败。
systemProp.org.gradle.internal.repository.max.retries=6
systemProp.org.gradle.internal.repository.initial.backoff=500
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=120000
# Flutter 的 gradle 插件是通过 includeBuild 并入的「独立构建」，它有自己的 settings，
# 解析 Kotlin 插件时只用默认的插件门户（gradlePluginPortal），本仓库里加的镜像对它无效。
# 这个属性由 Gradle 自己读取，直接改写门户地址本身，独立构建也会跟着走镜像。
# 校验依据：gradle 9.3.1 的 gradle-dependency-management.jar 里
# DefaultBaseRepositoryFactory 仍在读这个键。
# 镜像缺件时删掉这一行即可退回官方门户。
systemProp.org.gradle.internal.plugins.portal.url.override=https://maven.aliyun.com/repository/gradle-plugin
