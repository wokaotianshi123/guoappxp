org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
android.useAndroidX=true
android.newDsl=false
# flutter_js 0.8.7 仍在用旧版 kotlin-android 插件；AGP 9 的内置 Kotlin 会拒绝它。
# 待依赖插件迁移完再改回 true（见 Flutter built-in Kotlin 迁移文档）。
android.builtInKotlin=false
# flutter_js 把 Kotlin jvmTarget 写死成 1.8、Java 却是 11；build.gradle.kts 已按项目覆盖，
# 这里把一致性校验降级为警告，避免 KGP 升级后再因为同类校验直接失败。
kotlin.jvm.target.validation.mode=warning
