name: duanju_app
description: 独立运行的多端短剧应用
publish_to: none
version: 2.1.7+135

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  video_player: ^2.9.2
  ffi: ^2.2.0
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: ^1.0.7
  path: ^1.9.1
  path_provider: ^2.1.5
  path_provider_platform_interface: ^2.1.3
  path_provider_windows: ^2.3.0
  shared_preferences: ^2.5.5
  shared_preferences_platform_interface: ^2.4.2
  shared_preferences_windows:
    path: packages/shared_preferences_windows
  flutter_foreground_task: 11.0.3
  ffmpeg_kit_flutter_new_min_gpl: 2.6.7
  file_picker: 13.1.0
  crypto: ^3.0.7
  window_manager: ^0.5.1
  package_info_plus: ^10.2.1
  dynamic_color: ^2.1.0
  url_launcher: ^6.3.3
  # 直播播放时保持屏幕常亮。该插件本来就在 media_kit_video 的依赖树里，
  # 这里显式声明只是为了能直接引用，不会引入新的原生插件。
  wakelock_plus: ^1.8.0
  lpinyin: ^2.0.3
  # 隐藏浏览器：站源把分集地址写成 browser://<短链> 时，用它走完 Cloudflare
  # 挑战，把落地地址交回站源模块。只在取播放地址时用，不影响其它功能。
  flutter_inappwebview: 6.2.0-beta.3
  # JS 沙箱：脚本源（CatPawOpen / CatVodOpen 规范）在端侧直接执行。
  # Android / Windows 用 QuickJS，iOS / macOS 用系统 JavaScriptCore。
  flutter_js: ^0.8.7
  # 沙箱里的 fetch 宿主用 Dart 发请求（QuickJS 不自带 XHR），与站源模块
  # 共用同一套 UA / 超时策略。
  http: ^1.6.0
  # JS 沙箱导出 / 导入脚本源 zip。本就在 file_picker 的依赖树里，
  # 这里显式声明只是为了能直接引用，不会引入新的原生插件。
  archive: ^4.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  media_kit_libs_windows_video:
    path: packages/media_kit_libs_windows_video
  media_kit_video:
    path: packages/media_kit_video
  shared_preferences_windows:
    path: packages/shared_preferences_windows

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    # JS 沙箱的内置数据源。用户可在 我的 › JS 沙箱 里导入 / 替换。
    # hongguo.js 走官方 App 接口，签名参数在构建时注入。
    - assets/sources/hongguo.js
